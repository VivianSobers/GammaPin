# /etc/chrony/chrony.conf — identical on Node A, Node B and Node C.
# recv_ns in every GPL1 record depends on this; check `chronyc tracking` daily.
pool in.pool.ntp.org iburst maxsources 4
pool time.cloudflare.com iburst nts maxsources 2

driftfile /var/lib/chrony/chrony.drift
makestep 1.0 3
rtcsync
maxupdateskew 100.0
leapsectz right/UTC
logdir /var/log/chrony
