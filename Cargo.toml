[workspace]
resolver = "3"
members = [
    "crates/gp-log",
    "crates/gp-feed",
    "crates/gp-capture",
    "crates/gp-merge",
    "crates/gp-replay",
    "crates/gp-quant",
    "crates/gp-monitor",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/guru-bharadwaj20/GammaPin"

# Shared versions. Crates opt in with `foo = { workspace = true }`.
[workspace.dependencies]
gp-log = { path = "crates/gp-log" }
gp-feed = { path = "crates/gp-feed" }
gp-replay = { path = "crates/gp-replay" }
gp-quant = { path = "crates/gp-quant" }

tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
prost = "0.14"
prost-build = "0.14"
protox = "0.9"
memmap2 = "0.9"
crc32c = "0.6"
zstd = "0.14"
notify = "8"
arrow = "60"
parquet = "60"
axum = { version = "0.8", features = ["ws"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
anyhow = "1"
thiserror = "2"
rand = "0.10"
sha2 = "0.11"
libm = "0.2"
pyo3 = { version = "0.29", features = ["abi3-py312"] }
numpy = "0.29"

proptest = "1"
tempfile = "3"
criterion = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
