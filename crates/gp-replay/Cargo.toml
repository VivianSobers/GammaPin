[package]
name = "gp-replay"
description = "Deterministic replay behind the same stream interface as the live feed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["cli"]
# the gp-replay binary; library users can turn it off to skip clap
cli = ["dep:clap"]

[dependencies]
clap = { workspace = true, optional = true }
crc32c.workspace = true
gp-feed.workspace = true
memmap2.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "gp-replay"
required-features = ["cli"]

[[test]]
name = "determinism"
required-features = ["cli"]

[[bench]]
name = "replay"
harness = false
