# Copy to config/gammapin.toml (git-ignored) or /etc/gammapin/gammapin.toml.

[node]
name = "A"                  # A | B | C
data_dir = "data"           # data/{node}/{date}/seg-{n}.gpl

[upstox]
token_file = "/etc/gammapin/upstox.token"   # access token, written by hand each morning; watched by gp-capture
instrument_master_url = "https://assets.upstox.com/market-quote/instruments/exchange/NSE.json.gz"
api_base = "https://api.upstox.com"         # feed authorize endpoint host

[capture]
window_ist = ["09:00", "15:40"]
segment_mib = 64
flush_ms = 100
backoff_ms = [100, 5000]
strike_band_pct = 10        # +/- around the index spot
expiries = 2                # current + next Nifty weekly
max_instruments = 1500
master_path = "data/NSE.json.gz"   # cached instrument master
# feed_url = "ws://127.0.0.1:9100"  # connect here instead of Upstox (mock feed, dry runs)

[merge]
nodes = ["A", "B"]              # src_mask bit 0, bit 1
inbox = "/srv/gammapin/inbox"   # Node A/B segments land here (rsync over LAN): {inbox}/{node}/{date}/
out = "data/merged"             # C1 Parquet, replay.gpr and coverage under {out}/date=YYYY-MM-DD/
master_path = "data/NSE.json.gz"   # {date} in the path is replaced by the merged day
oi_in_units = true              # feed OI in units, divided by the lot size (unverified, see PREREGISTRATION.md)
compress = true                 # zstd the node segments after a successful merge

[monitor]
bind = "0.0.0.0:8080"
snapshot_ms = 1000
static_dir = "crates/gp-monitor/static"
rate = 0.065                    # RBI 91-day T-bill, decimal
holidays = ["2026-10-20", "2026-11-10", "2026-11-24", "2026-12-25"]   # docs/CALENDAR.md; confirm 9 vs 10 Nov with NSE
# S1/S2 [w_c, w_p] from the previous day's participant OI (research/participant_oi.py).
# S0 is always shown.
# weights = { S1 = [-0.31, 0.58], S2 = [-0.29, 0.55] }

[monitor.h1_accuracy]           # training-set H1 MAE (docs/RESULTS.md)
S0 = { mae = 201.6, n = 66 }
S1 = { mae = 165.2, n = 65 }
S2 = { mae = 166.5, n = 65 }
